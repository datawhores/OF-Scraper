name: codecov
permissions: read-all
on:
  push:
    branches: main
    # doc-only changes don't need a build or test run
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'media/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: main
    # doc-only changes don't need a build or test run
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'media/**'
      - 'LICENSE*'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
      # ruff is pinned in the test extra, so uv.lock decides its version.
      # Linting doesn't need the package itself, whose version comes from git
      # tags this shallow checkout doesn't have.
      - name: Install dependencies
        run: uv sync --frozen --extra test --no-install-project
      - name: Run ruff
        run: uv run --no-sync ruff check --output-format github
      # blind excepts in ofscraper/data/api and ofscraper/db may only go down
      - name: Check blind-except baseline
        if: ${{ !cancelled() }}
        run: uv run --no-sync python scripts/lint/check_blind_except.py
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported and current
        python-version: ["3.11", "3.15.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # version-pioneer derives the package version from git tags
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      # --frozen installs exactly what uv.lock pins, so a new upstream release
      # can't change what CI tests
      - name: Install dependencies
        run: uv sync --frozen --extra test
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run tests and collect coverage
        run: uv run --frozen pytest test --cov-report term --cov-report xml:coverage.xml --cov=ofscraper
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && matrix.python-version == '3.15.2' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
  # the optional PostgreSQL database, on the oldest PostgreSQL release still
  # supported and the newest, against a real server
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            postgres-version: "15"
          - python-version: "3.15.2"
            postgres-version: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          # a throwaway server that lives for this job only
          POSTGRES_PASSWORD: only-for-this-job
          POSTGRES_DB: ofscraper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # version-pioneer derives the package version from git tags
          fetch-depth: 0
          fetch-tags: true
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --extra test --extra postgres
      - name: create required folder
        run: mkdir -p /home/runner/.config/ofscraper/main_profile
      - name: Run the PostgreSQL tests
        env:
          OFSC_TEST_POSTGRES_URL: postgresql://postgres:only-for-this-job@localhost:5432/ofscraper_test
        # -rs lists skipped tests: none of these may skip here
        run: uv run --frozen pytest test/test_db_postgres.py test/test_db_postgres_live.py -rs
