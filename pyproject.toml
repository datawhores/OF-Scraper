[project]
name = "ofscraper-community"
dynamic = ["version"]
description = "automatically scrape onlyfans"
authors = [{ name = "datawhores", email = "datawhores@riseup.net" }]
readme = "README.md"
requires-python = ">=3.11, <3.16"
dependencies = [
  "aiofiles~=25.1.0",
  "aiohttp>=3.14.5,<4",
  "aiolimiter~=1.3.0",
  "aioprocessing~=2.0.1",
  "arrow~=1.4.0",
  "browser-cookie3==0.19.1",
  "bs4~=0.0.2",
  "certifi>=2026.10.18",
  "click>=8.5.1,<9",
  "cloup~=4.0.0",
  "diskcache~=5.6.3",
  "humanfriendly~=10.0",
  "httpx[http2]~=0.28.1",
  "idna>=3.15,<4",
  "inquirerpy~=0.3.4",
  "limiter~=0.5.0",
  "lxml~=6.1.2",
  "mpegdash~=0.4.0",
  "pathvalidate~=3.3.1",
  "prompt-toolkit~=3.0.53",
  "psutil~=7.2.2",
  "pynumparser~=1.4.1",
  "python-dateutil>=2.9.0.post0,<3",
  "pywidevine~=1.9.0",
  "requests~=2.34.2",
  "rich~=15.0.0",
  "schedule~=1.2.1",
  "setproctitle~=1.3.3",
  "speedtest-cli~=2.1.3",
  "tenacity~=9.2.1",
  "textual~=8.2.8",
  "uvloop~=0.23.0; sys_platform == 'linux' or sys_platform == 'linux2'",
  "win32-setctime~=1.2.1",
  "xxhash~=4.1.0",
  "pyyaml>=6.0.2",
  "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["autopep8~=2.0.2", "pyinstaller"]
test = [
  "pytest~=9.0.3",
  "coverage~=7.15.4",
  "pytest-cov~=7.1.0",
  "random-unicode-emoji>=2.8,<4.0",
  "random-emoji~=1.0.15",
  "pytest-mock~=3.17.0",
]
docs = ["sphinx-argparse~=0.5.2"]
ffmpeg = ["pyffmpeg>=2.5.2.3.1"]

[project.scripts]
ofscraper = "ofscraper.__main__:main"

[project.urls]
"Homepage" = "https://github.com/cloakedkeys/OF-Scraper-Community"

# --- Build System & Tool Configuration ---

# This section tells hatchling how to build the wheel.
[tool.hatch.build.targets.wheel]
packages = ["ofscraper"]

[build-system]
requires = ["hatchling", "version-pioneer"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "version-pioneer"

[tool.version-pioneer]
# This tells the plugin to create a _version.py file inside your ofscraper package.
versionscript = "plugins.py"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
# a warning is a bug to fix or a filter to justify here
filterwarnings = ["error"]
testpaths = ["test"]
# test/legacy targets the pre-3.12 module layout and no longer imports
norecursedirs = ["legacy"]
