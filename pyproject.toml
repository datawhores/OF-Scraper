[project]
name = "ofscraper"
dynamic = ["version"]
description = "automatically scrape onlyfans"
authors = [{ name = "datawhores", email = "datawhores@riseup.net" }]
readme = "README.md"
license = "GPL-3.0-or-later"
# No upper bound: with one, pip on a newer Python skips every current release
# and installs the newest old one without a bound (2.6.4.1, from 2023)
# instead of failing.
requires-python = ">=3.11"
dependencies = [
  "aiofiles~=25.1.0",
  "aiohttp>=3.14.5,<4",
  "aiolimiter~=1.3.0",
  "arrow~=1.4.0",
  "browser-cookie3==0.20.1",
  "beautifulsoup4>=4.14.3,<4.16.0",
  "certifi>=2026.10.18",
  "click>=8.5.1,<9",
  "cloup~=4.0.0",
  "diskcache~=5.6.3",
  "humanfriendly~=10.0",
  "httpx[http2]>=0.28.1,<0.30.0",
  "idna>=3.15,<4",
  "inquirerpy~=0.3.4",
  "lxml~=6.1.2",
  "mpegdash~=0.4.0",
  "pathvalidate~=3.3.1",
  "prompt-toolkit~=3.0.53",
  "psutil~=7.2.2",
  "pynumparser~=1.4.1",
  "python-dateutil>=2.9.0.post0,<5",
  "python-dotenv~=1.2.2",
  "pywidevine~=1.9.0",
  "rich~=15.0.0",
  "schedule~=1.2.1",
  "setproctitle~=1.3.3",
  "tenacity~=9.2.1",
  "textual~=8.2.8",
  "uvloop~=0.23.0; sys_platform == 'linux' or sys_platform == 'linux2'",
  "win32-setctime~=1.2.1",
  "xxhash~=4.1.0",
  "pyyaml>=6.0.2",
  # PostgreSQL (OFSC_DATABASE_URL), where psycopg has prebuilt wheels. Elsewhere
  # (Windows on ARM, Android) the first run with the variable set installs it,
  # or it's the `postgres` extra
  "psycopg[binary,pool]>=3.3.9; sys_platform == 'darwin' or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'ppc64le' or platform_machine == 'riscv64'))",
]

[project.optional-dependencies]
dev = ["autopep8>=2.0.2,<2.4.0", "pyinstaller"]
test = [
  "pytest>=9.0.3,<9.3.0",
  "pytest-xdist>=3.6.0,<4",
  "coverage>=7.15.4,<7.18.0",
  "pytest-cov~=7.1.0",
  "random-unicode-emoji~=3.0",
  "random-emoji~=1.0.15",
  "pytest-mock~=3.17.0",
  # exact pin: a new ruff release can add findings to the same rules
  "ruff==0.17.6",
]
docs = ["sphinx-argparse>=0.5.2,<0.7.0"]
ffmpeg = ["pyffmpeg>=2.5.2.3.1"]
# the optional PostgreSQL database (OFSC_DATABASE_URL)
postgres = ["psycopg[binary,pool]>=3.3.9"]
# recording OnlyFans livestreams (a Chromium browser; then run: playwright install chromium)
live = ["playwright>=1.40,<2"]

[project.scripts]
ofscraper = "ofscraper.__main__:main"

[project.urls]
"Homepage" = "https://github.com/datawhores/OF-Scraper"

# --- Build System & Tool Configuration ---

# This section tells hatchling how to build the wheel.
[tool.hatch.build.targets.wheel]
packages = ["ofscraper"]

[build-system]
requires = ["hatchling", "version-pioneer"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.hatch.version]
source = "version-pioneer"

[tool.version-pioneer]
# This tells the plugin to create a _version.py file inside your ofscraper package.
versionscript = "plugins.py"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
# a warning is a bug to fix or a filter to justify here
filterwarnings = ["error"]
pythonpath = [".", "test"]
testpaths = ["test"]
# test/legacy targets the pre-3.12 module layout and no longer imports
norecursedirs = ["legacy"]
markers = [
  "slow: subprocess, ffmpeg, real-timeout, or bulk-DB integration tests (skip locally with -m 'not slow')",
]

[tool.ruff]
# lint the application only; test/ and scripts/ aren't checked yet
include = ["ofscraper/**/*.py"]
target-version = "py311"

[tool.ruff.lint]
# narrow on purpose: syntax errors, pyflakes (undefined or unused names) and
# bugbear. Blind excepts and try/except/pass in ofscraper/data/api and
# ofscraper/db are checked against a baseline by
# scripts/lint/check_blind_except.py, not here.
select = ["E9", "F", "B"]
ignore = [
  # raise-without-from-inside-except: adding `from err`/`from None` changes
  # the chained traceback users and logs see, so each site needs a decision
  "B904",
  # zip-without-explicit-strict: strict=True can raise where the code relied
  # on truncation, and strict=False everywhere is noise
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# prompts.py is the re-export hub for the prompt_groups modules
"ofscraper/prompts/prompts.py" = ["F403"]
